version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: securechat-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securechat_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-securechat_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-securechat} -d ${POSTGRES_DB:-securechat_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
